{% if site.goatcounter.enabled and site.goatcounter.code %}
  <span class="post-views" aria-live="polite"></span>
  <script>
    (function () {
      var target = document.currentScript.previousElementSibling;
      var attempts = 0;
      var timer = window.setInterval(function () {
        attempts += 1;
        if (window.goatcounter && window.goatcounter.get_data) {
          window.clearInterval(timer);
          var request = new XMLHttpRequest();
          request.addEventListener('load', function () {
            if (request.status !== 200) return;
            try {
              target.textContent = JSON.parse(request.responseText).count;
            } catch (error) {
              target.textContent = '';
            }
          });
          request.open(
            'GET',
            'https://{{ site.goatcounter.code }}.goatcounter.com/counter/' +
              encodeURIComponent(window.goatcounter.get_data().p) + '.json'
          );
          request.send();
        } else if (attempts === 100) {
          window.clearInterval(timer);
        }
      }, 100);
    }());
  </script>
{% endif %}
