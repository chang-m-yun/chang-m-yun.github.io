---
layout: default
---

<article class="blog-post">
  <div class="post-meta">
    <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>
    <span aria-hidden="true"> · </span>
    <span>by {{ page.author | default: site.author | default: site.title }}</span>
    <span aria-hidden="true"> · </span>
    {% include goatcounter-view-count.html %}
  </div>

  <h1>{{ page.title }}</h1>

  {{ content }}

  {% if page.tags %}
    <p class="post-tags"><small>Tags: {{ page.tags | join: ", " }}</small></p>
  {% endif %}

  {% include giscus.html %}
</article>
