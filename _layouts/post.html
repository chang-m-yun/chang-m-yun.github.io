---
layout: default
---

<h1>{{ page.title }}</h1>

<p class="view">Date: <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%Y-%m-%d" }}</time></p>

<p class="view">Author: {{ page.author | default: site.author }}</p>

<p class="view post-view-count">Views: {% include goatcounter-view-count.html %}</p>

{{content}}

{% if page.tags %}
  <small>tags: <em>{{ page.tags | join: "</em> - <em>" }}</em></small>
{% endif %}
